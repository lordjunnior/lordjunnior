<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 150" width="1280" height="150" role="img" aria-label="Mais de 17 anos de design e motion, 3 produtos no ar, 1 profissional do começo ao fim">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E1628"/>
      <stop offset="1" stop-color="#16203A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="1" stop-color="#F5A623"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="150" rx="16" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1278.5" height="148.5" rx="15.5" fill="none" stroke="#F5B642" stroke-opacity="0.25" stroke-width="1.5"/>
  <rect x="426" y="30" width="1.5" height="90" fill="#FFFFFF" fill-opacity="0.1"/>
  <rect x="853" y="30" width="1.5" height="90" fill="#FFFFFF" fill-opacity="0.1"/>
  <text x="213" y="84" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#gold)">17+</text>
  <text x="213" y="114" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#A9B8D0">ANOS DE DESIGN E MOTION</text>
  <text x="640" y="84" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#gold)">3</text>
  <text x="640" y="114" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#A9B8D0">PRODUTOS NO AR</text>
  <text x="1067" y="84" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="url(#gold)">1</text>
  <text x="1067" y="114" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="2.5" fill="#A9B8D0">PESSOA, DO COMEÇO AO FIM</text>
