name: Cobrinha Ouro e Brasa

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: lordjunnior
          outputs: |
            dist/cobrinha-ouro-brasa.svg?palette=github-dark&color_snake=#e8a33d&color_dots=#1a1410,#4a2a12,#7c3a10,#c2410c,#e8a33d&color_dot_border=#0c0907&color_background=#0c0907

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
